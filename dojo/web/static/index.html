<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="dojo-token" content="__DOJO_TOKEN__">
<meta name="color-scheme" content="dark light">
<title>dojo</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/static/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/theme.js"></script>
</head>
<body>
<div class="shell">
  <aside class="side" aria-label="Sections">
    <a class="brand" href="#/"><span class="brand-mark"></span><span>dojo</span></a>
    <div class="who" id="who"></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="fresh"><span class="sq" id="fresh-sq"></span><span class="mono" id="fresh-label">loading…</span></div>
      <button class="sync-btn" type="button" data-sync>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
        <span data-sync-label>Sync</span>
      </button>
      <div class="seg seg-theme" role="radiogroup" aria-label="Theme">
        <button type="button" role="radio" data-theme-opt="dark">Dark</button>
        <button type="button" role="radio" data-theme-opt="light">Light</button>
      </div>
    </div>
  </aside>

  <header class="phone-bar">
    <div class="phone-row">
      <a class="brand brand-s" href="#/"><span class="brand-mark"></span><span>dojo</span></a>
      <span id="phone-rating"></span>
      <span class="grow"></span>
      <button class="icon-btn" type="button" data-sync aria-label="Sync">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
      </button>
      <button class="icon-btn" type="button" id="theme-toggle" aria-label="Toggle theme">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>
      <button class="menu-btn" type="button" id="menu-btn" aria-expanded="false" aria-controls="phone-menu">
        <span id="menu-label">Home</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
    </div>
    <div class="phone-menu" id="phone-menu" hidden></div>
  </header>

  <main class="main">
    <div id="banner"></div>
    <div class="syncbar" id="syncbar" hidden></div>
    <div class="view" id="view" tabindex="-1"></div>
  </main>
</div>
<div id="toast-root" aria-live="polite"></div>
<script src="/static/app.js"></script>
</body>
</html>
