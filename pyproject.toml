[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dojo"
version = "0.1.0"
description = "Personal Codeforces coach and course-drill trainer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
dojo = "dojo.cli:main"

[tool.setuptools.packages.find]
include = ["dojo*"]

[tool.setuptools.package-data]
"dojo.run" = ["templates/*"]
"dojo.web" = ["static/*", "ARCHIVO-OFL.txt"]
